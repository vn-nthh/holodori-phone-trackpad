name: Build Windows release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release bundle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $releaseName = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "v$version"
          }
          .\packaging\build-experimental.ps1 `
            -Name "HolodoriUsbTetheredUdp-$releaseName" `
            -CargoHome "$env:USERPROFILE\.cargo" `
            -JavaHome $env:JAVA_HOME `
            -AndroidSdk $env:ANDROID_HOME

      - uses: actions/upload-artifact@v4
        with:
          name: HolodoriPhoneTrackpad-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = Join-Path "packaging\release-notes" "$env:GITHUB_REF_NAME.md"
          $isPrerelease = $env:GITHUB_REF_NAME -like "*-alpha*"
          if ($isPrerelease) {
            $assets = Get-ChildItem "release" -File |
              Where-Object { $_.Extension -in @(".zip", ".apk") } |
              ForEach-Object FullName
            gh release create $env:GITHUB_REF_NAME $assets --title "Holodori Phone Trackpad $env:GITHUB_REF_NAME" --notes-file $notesFile --prerelease
          } else {
            $assets = Get-ChildItem "release" -File | ForEach-Object FullName
            gh release create $env:GITHUB_REF_NAME $assets --title "Holodori Phone Trackpad $env:GITHUB_REF_NAME" --notes-file $notesFile
          }
