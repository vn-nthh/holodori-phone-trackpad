[package]
name = "holodori-native-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
blake2 = "0.10.6"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.3"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# 0.2.189 is the verified floor for the uinput and getifaddrs APIs used by
# the Linux input and tether-peer classification paths.
libc = "0.2.189"
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }

[lib]
name = "holodori_native_host"
path = "src/lib.rs"

[[bin]]
name = "holodori-native-host"
path = "src/bin/host.rs"

[[bin]]
name = "holodori-touch-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "holodori-touch-smoke"
path = "src/bin/smoke.rs"
