plugins {
    id "com.android.application"
}

def holodoriVersion = rootProject.file("../VERSION").text.trim()

android {
    namespace "dev.holodori.trackpad"
    compileSdk 35

    defaultConfig {
        applicationId "dev.holodori.trackpad"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName holodoriVersion
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }
}
