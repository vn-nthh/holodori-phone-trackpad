plugins {
    id "com.android.application"
}
android {
    namespace "dev.holodori.trackpad"
    compileSdk 35

    defaultConfig {
        applicationId "dev.holodori.trackpad"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.1.2"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }
}
